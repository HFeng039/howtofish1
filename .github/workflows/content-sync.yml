name: content-sync

on:
  schedule:
    # Official sync only; collect/update stays manual to avoid paid API usage.
    # Runs every 3 days at 08:17 Asia/Shanghai.
    # Disable this workflow in GitHub Actions to stop scheduled monitoring.
    - cron: "17 0 */3 * *"
  workflow_dispatch:
    inputs:
      game:
        description: "Optional game slug; leave empty to sync all games"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run content sync
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GAME_FILTER: ${{ inputs.game }}
        run: |
          args=()
          if [[ -n "$GAME_FILTER" ]]; then
            args+=(--game "$GAME_FILTER")
          fi
          node scripts/sync.mjs sync "${args[@]}"
      - name: Commit if changed
        run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "content: sync game data $(date -u +%FT%TZ)"
            git push
          fi
